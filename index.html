<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="护肤产品企划情报站：聚合新品、论文、报告、法规、原料、专利、竞品与消费者趋势。">
  <title>护肤产品企划情报站</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08100e;
      --surface: #101a17;
      --surface-2: #15221e;
      --surface-3: #1b2a25;
      --border: #293b35;
      --text: #edf5f1;
      --muted: #94a9a1;
      --accent: #57d39b;
      --accent-soft: rgba(87, 211, 155, 0.13);
      --red: #ff6577;
      --orange: #ffad57;
      --green: #61d994;
      --blue: #73a8ff;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 88% -10%, rgba(62, 151, 112, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    body.lock { overflow: hidden; }

    button, input, select { font: inherit; }

    button { color: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(74, 104, 93, 0.55);
      background: rgba(8, 16, 14, 0.94);
      backdrop-filter: blur(18px);
    }

    .header-inner,
    main,
    footer {
      width: min(1480px, calc(100% - 40px));
      margin-inline: auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 0 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      letter-spacing: -0.02em;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(118px, 0.75fr)) minmax(250px, 1.65fr);
      gap: 10px;
      padding-bottom: 16px;
    }

    .control {
      position: relative;
      min-width: 0;
    }

    .control label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    select,
    input[type="search"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    select { padding: 0 34px 0 12px; }

    input[type="search"] { padding: 0 42px 0 40px; }

    select:focus,
    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-control::before {
      content: "⌕";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-52%);
      color: var(--muted);
      font-size: 1.25rem;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .search-clear:hover { background: var(--surface-3); color: var(--text); }

    main { padding: 24px 0 40px; }

    .section {
      margin-bottom: 30px;
      scroll-margin-top: 150px;
    }

    .section[hidden] { display: none; }

    .search-section {
      padding: 18px;
      border: 1px solid rgba(87, 211, 155, 0.38);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(87, 211, 155, 0.09), rgba(16, 26, 23, 0.92));
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.18);
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: 0.01em;
    }

    .count { color: var(--accent); font-weight: 700; }

    .section-note {
      color: var(--muted);
      font-size: 0.84rem;
      text-align: right;
    }

    .clear-results {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 11px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
    }

    .clear-results:hover { border-color: var(--accent); color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
      gap: 14px;
    }

    .card {
      min-width: 0;
      min-height: 228px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(150deg, var(--surface-2), var(--surface));
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(87, 211, 155, 0.72);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
      outline: none;
    }

    .kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .type {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date { flex: none; }

    .card h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.42;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .summary {
      margin: 0;
      color: #bdcbc6;
      font-size: 0.88rem;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.025);
      color: #b7c7c1;
      font-size: 0.72rem;
    }

    .priority { border: 0; color: #07100d; font-weight: 800; }
    .priority.p0 { background: var(--red); }
    .priority.p1 { background: var(--orange); }
    .priority.p2 { background: var(--green); }
    .evidence { color: var(--blue); }

    .empty {
      grid-column: 1 / -1;
      min-height: 140px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .empty strong { display: block; margin-bottom: 4px; color: var(--text); }
    .empty small { font-size: 0.82rem; }

    footer {
      padding: 20px 0 34px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(1, 6, 4, 0.76);
      backdrop-filter: blur(8px);
    }

    .modal.open { display: grid; }

    .dialog {
      position: relative;
      width: min(920px, 100%);
      max-height: min(86vh, 900px);
      overflow: auto;
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #0e1815;
      box-shadow: var(--shadow);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .modal-close:hover { color: var(--text); border-color: var(--accent); }

    .eyebrow {
      margin: 0 48px 7px 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .dialog h2 {
      margin: 0 50px 22px 0;
      font-size: clamp(1.25rem, 2.6vw, 1.7rem);
      line-height: 1.42;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }

    .detail.wide { grid-column: 1 / -1; }

    .label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .value {
      color: #d9e4df;
      font-size: 0.9rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .source-link {
      display: inline-flex;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--accent);
      color: #06100c;
      font-weight: 800;
      text-decoration: none;
    }

    .source-link:hover { filter: brightness(1.08); }

    @media (max-width: 1050px) {
      .filters { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 680px) {
      .header-inner,
      main,
      footer { width: min(100% - 24px, 1480px); }

      .title-row { align-items: flex-start; flex-direction: column; gap: 6px; }
      .meta { white-space: normal; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search-control { grid-column: 1 / -1; }
      .section-heading { align-items: flex-start; }
      .section-note { text-align: left; }
      .details { grid-template-columns: 1fr; }
      .detail.wide { grid-column: auto; }
      .dialog { padding: 22px 16px; }
    }

    @media (max-width: 420px) {
      .filters { grid-template-columns: 1fr; }
      .search-control { grid-column: auto; }
      .section-heading { flex-direction: column; gap: 7px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="title-row">
        <h1>🧪 护肤产品企划情报站</h1>
        <div class="meta" aria-live="polite">
          <span>最后更新时间：<strong id="updatedAt">—</strong></span>
          <span>·</span>
          <span>共 <strong id="totalCount">0</strong> 条</span>
        </div>
      </div>

      <div class="filters" aria-label="情报筛选栏">
        <div class="control">
          <label for="region">区域</label>
          <select id="region">
            <option value="all">全部区域</option>
            <option value="CN">CN</option>
            <option value="JP">JP</option>
            <option value="KR">KR</option>
            <option value="US">US</option>
            <option value="EU">EU</option>
            <option value="global">global</option>
          </select>
        </div>

        <div class="control">
          <label for="domain">情报域</label>
          <select id="domain">
            <option value="all">全部情报域</option>
            <option value="consumer">消费者趋势</option>
            <option value="competitor">竞品动态</option>
            <option value="tech">技术原料</option>
            <option value="evidence">证据链</option>
            <option value="regulatory">法规宣称</option>
            <option value="supply">供应链专利</option>
            <option value="format">剂型包材</option>
            <option value="feedback">上市反馈</option>
          </select>
        </div>

        <div class="control">
          <label for="type">类型</label>
          <select id="type">
            <option value="all">全部类型</option>
            <option value="新品">新品</option>
            <option value="论文">论文</option>
            <option value="报告">报告</option>
            <option value="法规">法规</option>
            <option value="原料">原料</option>
            <option value="专利">专利</option>
            <option value="竞品">竞品</option>
            <option value="消费者">消费者</option>
          </select>
        </div>

        <div class="control">
          <label for="priority">优先级</label>
          <select id="priority">
            <option value="all">全部优先级</option>
            <option value="P0">P0</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
          </select>
        </div>

        <div class="control">
          <label for="evidence">证据等级</label>
          <select id="evidence">
            <option value="all">全部证据等级</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <div class="control search-control">
          <label for="search">搜索</label>
          <input id="search" type="search" autocomplete="off" placeholder="搜索标题、品牌、成分、技术">
          <button id="searchClear" class="search-clear" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="searchSection" class="section search-section" hidden aria-live="polite">
      <div class="section-heading">
        <div>
          <h2>搜索结果 <span id="searchCount" class="count">(0)</span></h2>
          <div id="searchNote" class="section-note">匹配当前关键词和筛选条件</div>
        </div>
        <button id="clearResults" class="clear-results" type="button">清除搜索</button>
      </div>
      <div id="searchGrid" class="grid"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <h2>本周 Top 5 <span id="topCount" class="count">(0)</span></h2>
          <div class="section-note">本周最值得进入产品决策的信号</div>
        </div>
      </div>
      <div id="topGrid" class="grid"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <h2>法规预警 <span id="regCount" class="count">(0)</span></h2>
          <div class="section-note">法规变化、宣称边界与上市风险</div>
        </div>
      </div>
      <div id="regGrid" class="grid"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <h2>技术雷达 <span id="techCount" class="count">(0)</span></h2>
          <div class="section-note">新原料、新机制与可转化技术</div>
        </div>
      </div>
      <div id="techGrid" class="grid"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <h2>全部情报 <span id="allCount" class="count">(0)</span></h2>
          <div class="section-note">受区域、情报域、类型、优先级和证据等级筛选影响</div>
        </div>
      </div>
      <div id="allGrid" class="grid"></div>
    </section>
  </main>

  <footer>
    情报用于产品企划研判；涉及法规、功效和安全性的决策，请回到原始文件与目标市场现行规则复核。
  </footer>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="dialog">
      <button id="close" class="modal-close" type="button" aria-label="关闭详情">×</button>
      <div id="modalEyebrow" class="eyebrow"></div>
      <h2 id="modalTitle"></h2>
      <div id="details" class="details"></div>
      <a id="sourceLink" class="source-link" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const DOMAIN_LABELS = {
        consumer: "消费者趋势",
        competitor: "竞品动态",
        tech: "技术原料",
        evidence: "证据链",
        regulatory: "法规宣称",
        supply: "供应链专利",
        format: "剂型包材",
        feedback: "上市反馈"
      };

      const DOMAIN_ALIASES = {
        competitive: "competitor",
        supply_patent: "supply",
        form_packaging: "format",
        market_feedback: "feedback"
      };

      const REGION_ALIASES = {
        中国: "CN",
        日本: "JP",
        韩国: "KR",
        美国: "US",
        欧洲: "EU",
        全球: "global",
        GLOBAL: "global"
      };

      const $ = selector => document.querySelector(selector);

      const state = {
        items: [],
        filters: {
          region: "all",
          domain: "all",
          type: "all",
          priority: "all",
          evidence: "all",
          query: ""
        }
      };

      const elements = {
        region: $("#region"),
        domain: $("#domain"),
        type: $("#type"),
        priority: $("#priority"),
        evidence: $("#evidence"),
        search: $("#search"),
        searchClear: $("#searchClear"),
        clearResults: $("#clearResults"),
        searchSection: $("#searchSection"),
        searchNote: $("#searchNote"),
        modal: $("#modal"),
        close: $("#close"),
        details: $("#details"),
        sourceLink: $("#sourceLink")
      };

      let lastFocus = null;

      function pick(object, keys, fallback = "") {
        for (const key of keys) {
          if (object[key] !== undefined && object[key] !== null && object[key] !== "") {
            return object[key];
          }
        }
        return fallback;
      }

      function text(value) {
        return value === undefined || value === null || value === "" ? "—" : String(value);
      }

      function truthy(value) {
        return value === true || value === 1 || String(value).toLowerCase() === "true";
      }

      function safeUrl(value) {
        try {
          const parsed = new URL(String(value));
          return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : "";
        } catch {
          return "";
        }
      }

      function formatDate(value) {
        if (!value) return "日期未知";
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return text(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(parsed);
      }

      function normalize(item, index) {
        const rawDomain = String(pick(item, ["domain", "intel_domain", "情报域"]));
        const domainFromLabel = Object.entries(DOMAIN_LABELS)
          .find(([, label]) => label === rawDomain)?.[0];
        const domain = DOMAIN_ALIASES[rawDomain] || domainFromLabel || rawDomain;
        const rawRegion = String(pick(item, ["region", "区域"], "global"));
        const priority = String(pick(item, ["priority", "优先级"], "P2")).toUpperCase();
        const evidence = String(pick(item, ["evidence_level", "evidence", "证据等级"], "D")).toUpperCase();

        return {
          id: pick(item, ["id", "uuid"], `item-${index}`),
          title: text(pick(item, ["title", "标题"], "未命名情报")),
          summary: text(pick(item, ["summary", "摘要", "what_happened", "发生了什么"], "暂无摘要")),
          source: text(pick(item, ["source", "来源"])),
          date: pick(item, ["date", "published_at", "发布日期", "日期"]),
          region: REGION_ALIASES[rawRegion] || rawRegion,
          type: text(pick(item, ["type", "类型"], "报告")),
          domain,
          domainLabel: DOMAIN_LABELS[domain] || text(rawDomain || "未分类"),
          priority: ["P0", "P1", "P2"].includes(priority) ? priority : "P2",
          evidence: ["A", "B", "C", "D"].includes(evidence) ? evidence : "D",
          feasibility: text(pick(item, ["regulatory_feasibility", "feasibility", "法规可行性"], "待评估")),
          happened: text(pick(item, ["what_happened", "发生了什么"], pick(item, ["summary", "摘要"]))),
          strength: text(pick(item, ["evidence_strength", "证据强度"], evidence)),
          use: text(pick(item, ["value_for_pm", "planning_use", "product_planning_use", "对产品企划的用途"])),
          risks: text(pick(item, ["risks", "risks_limitations", "风险与限制"])),
          action: text(pick(item, ["action", "recommended_action", "建议动作"])),
          worth: text(pick(item, ["worth_full_read", "worth_reading", "值得读全文吗"])),
          brand: text(pick(item, ["brand", "品牌"], "")),
          ingredients: text(pick(item, ["ingredients", "ingredient", "成分"], "")),
          technology: text(pick(item, ["technology", "tech", "技术"], "")),
          top5: truthy(pick(item, ["top5", "is_top5"])),
          alert: truthy(pick(item, ["regulatory_alert", "法规预警"])),
          url: safeUrl(pick(item, ["url", "source_url", "original_url", "原文链接"]))
        };
      }

      function createTag(label, className = "") {
        const tag = document.createElement("span");
        tag.className = `tag ${className}`.trim();
        tag.textContent = label;
        return tag;
      }

      function createCard(item) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.setAttribute("aria-label", `查看详情：${item.title}`);

        const kicker = document.createElement("div");
        kicker.className = "kicker";

        const type = document.createElement("span");
        type.className = "type";
        type.textContent = `${item.type} · ${item.source}`;

        const date = document.createElement("time");
        date.className = "date";
        date.textContent = formatDate(item.date);
        kicker.append(type, date);

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = item.summary;

        const tags = document.createElement("div");
        tags.className = "tags";
        tags.append(
          createTag(item.priority, `priority ${item.priority.toLowerCase()}`),
          createTag(`证据 ${item.evidence}`, "evidence"),
          createTag(`法规：${item.feasibility}`),
          createTag(item.region),
          createTag(item.domainLabel)
        );

        card.append(kicker, heading, summary, tags);
        card.addEventListener("click", () => openModal(item, card));
        return card;
      }

      function renderGrid(gridId, countId, items, hint, emptyTitle = "暂无情报数据") {
        const grid = $(`#${gridId}`);
        const count = $(`#${countId}`);
        grid.replaceChildren();
        count.textContent = `(${items.length})`;

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const content = document.createElement("div");
          const title = document.createElement("strong");
          const message = document.createElement("small");
          title.textContent = emptyTitle;
          message.textContent = hint;
          content.append(title, message);
          empty.append(content);
          grid.append(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        items.forEach(item => fragment.append(createCard(item)));
        grid.append(fragment);
      }

      function matchesDropdowns(item) {
        const filters = state.filters;
        return (
          (filters.region === "all" || item.region === filters.region) &&
          (filters.domain === "all" || item.domain === filters.domain) &&
          (filters.type === "all" || item.type === filters.type) &&
          (filters.priority === "all" || item.priority === filters.priority) &&
          (filters.evidence === "all" || item.evidence === filters.evidence)
        );
      }

      function searchableText(item) {
        return [
          item.title,
          item.source,
          item.brand,
          item.ingredients,
          item.technology,
          item.summary,
          item.happened,
          item.strength,
          item.feasibility,
          item.use,
          item.risks,
          item.action,
          item.worth,
          item.region,
          item.type,
          item.domainLabel
        ].join(" ").toLocaleLowerCase("zh-CN");
      }

      function filteredItems() {
        return state.items.filter(matchesDropdowns);
      }

      function searchResults() {
        const query = state.filters.query.trim().toLocaleLowerCase("zh-CN");
        if (!query) return [];
        return state.items.filter(item => matchesDropdowns(item) && searchableText(item).includes(query));
      }

      function render() {
        renderGrid(
          "topGrid",
          "topCount",
          state.items.filter(item => item.top5).slice(0, 5),
          "data.json 中暂无 top5=true 的条目"
        );

        renderGrid(
          "regGrid",
          "regCount",
          state.items.filter(item => item.domain === "regulatory" || item.alert),
          "当前没有法规预警条目"
        );

        renderGrid(
          "techGrid",
          "techCount",
          state.items.filter(item => item.domain === "tech"),
          "当前没有技术原料条目"
        );

        renderGrid(
          "allGrid",
          "allCount",
          filteredItems(),
          "请调整顶部筛选条件",
          "当前筛选条件下暂无情报"
        );

        const query = state.filters.query.trim();
        elements.searchSection.hidden = !query;
        elements.searchClear.hidden = !query;

        if (query) {
          const results = searchResults();
          elements.searchNote.textContent = `关键词“${query}” · 同时匹配当前下拉筛选条件`;
          renderGrid(
            "searchGrid",
            "searchCount",
            results,
            "请尝试更换关键词或放宽筛选条件",
            "没有找到匹配情报"
          );
        }
      }

      function addDetail(label, value, wide = false) {
        const item = document.createElement("div");
        item.className = `detail${wide ? " wide" : ""}`;
        const name = document.createElement("span");
        name.className = "label";
        name.textContent = label;
        const content = document.createElement("div");
        content.className = "value";
        content.textContent = text(value);
        item.append(name, content);
        elements.details.append(item);
      }

      function openModal(item, trigger) {
        lastFocus = trigger;
        $("#modalTitle").textContent = item.title;
        $("#modalEyebrow").textContent = `${item.priority} · 证据 ${item.evidence} · ${item.domainLabel}`;
        elements.details.replaceChildren();

        [
          ["来源", item.source],
          ["日期", formatDate(item.date)],
          ["区域", item.region],
          ["类型", item.type],
          ["情报域", item.domainLabel],
          ["证据强度", item.strength],
          ["法规可行性", item.feasibility],
          ["值得读全文吗", item.worth]
        ].forEach(([label, value]) => addDetail(label, value));

        [
          ["发生了什么", item.happened],
          ["对产品企划的用途", item.use],
          ["风险与限制", item.risks],
          ["建议动作", item.action]
        ].forEach(([label, value]) => addDetail(label, value, true));

        if (item.url) {
          elements.sourceLink.href = item.url;
          elements.sourceLink.hidden = false;
        } else {
          elements.sourceLink.removeAttribute("href");
          elements.sourceLink.hidden = true;
        }

        elements.modal.classList.add("open");
        elements.modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("lock");
        elements.close.focus();
      }

      function closeModal() {
        elements.modal.classList.remove("open");
        elements.modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("lock");
        if (lastFocus) lastFocus.focus();
      }

      function clearSearch() {
        elements.search.value = "";
        state.filters.query = "";
        render();
        elements.search.focus();
      }

      function updateMeta(data = {}) {
        $("#updatedAt").textContent = text(pick(data, ["updated_at", "updatedAt", "最后更新时间"], "未知"));
        $("#totalCount").textContent = String(state.items.length);
      }

      async function loadData() {
        try {
          const response = await fetch("./data.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const rawItems = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [];
          state.items = rawItems
            .filter(item => item && typeof item === "object")
            .map(normalize);
          updateMeta(Array.isArray(data) ? {} : data);
        } catch (error) {
          console.warn("data.json 读取失败", error);
          state.items = [];
          updateMeta();
        }
        render();
      }

      [
        [elements.region, "region"],
        [elements.domain, "domain"],
        [elements.type, "type"],
        [elements.priority, "priority"],
        [elements.evidence, "evidence"]
      ].forEach(([element, key]) => {
        element.addEventListener("change", event => {
          state.filters[key] = event.target.value;
          render();
        });
      });

      let searchTimer;
      elements.search.addEventListener("input", event => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.filters.query = event.target.value;
          render();
        }, 100);
      });

      elements.searchClear.addEventListener("click", clearSearch);
      elements.clearResults.addEventListener("click", clearSearch);
      elements.close.addEventListener("click", closeModal);
      elements.modal.addEventListener("click", event => {
        if (event.target === elements.modal) closeModal();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && elements.modal.classList.contains("open")) {
          closeModal();
        }
      });

      loadData();
    })();
  </script>
</body>
</html>
