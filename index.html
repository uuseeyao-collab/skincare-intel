<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090c10">
<title>护肤产品企划情报站</title>
<style>
:root{color-scheme:dark;--bg:#090c10;--panel:#10151c;--hover:#18212b;--line:#27303c;--text:#e8edf2;--muted:#8e9aa8;--faint:#687382;--accent:#64d5b0;--red:#ff6b70;--orange:#ffad5c;--green:#65d190;--blue:#78a9ff;--purple:#ba9cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--text);background:radial-gradient(circle at 15% -10%,rgba(100,213,176,.07),transparent 30%),var(--bg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body.lock{overflow:hidden}button,input,select{font:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:rgba(9,12,16,.94);backdrop-filter:blur(16px)}.head,.filters,main{width:min(1500px,calc(100% - 40px));margin:auto}.head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px}.head h1{margin:0;font-size:clamp(19px,2vw,25px);line-height:1.2}.meta{display:flex;gap:10px;color:var(--muted);font-size:13px;white-space:nowrap}.meta span+span:before{content:"·";margin-right:10px;color:var(--faint)}
.filterbar{border-top:1px solid #1d2530}.filters{padding:11px 0;display:grid;grid-template-columns:repeat(5,minmax(120px,.75fr)) minmax(230px,1.6fr);gap:8px}.control{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--panel)}select.control{padding:0 30px 0 10px}input.control{padding:0 12px}input::placeholder{color:var(--faint)}.control:hover,.control:focus{border-color:#465468;background:#151b24}
main{padding:28px 0 60px}.section{margin-bottom:34px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.section h2{display:flex;align-items:center;gap:9px;margin:0;font-size:17px}.section h2:before{content:"";width:3px;height:17px;border-radius:2px;background:var(--accent)}.count,.note{color:var(--faint);font-size:12px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{min-width:0;min-height:220px;padding:16px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;color:inherit;background:var(--panel);text-align:left;cursor:pointer;transition:.16s}.card:hover{transform:translateY(-2px);border-color:#405063;background:var(--hover)}.kicker{display:flex;justify-content:space-between;gap:10px;margin-bottom:11px;color:var(--muted);font-size:12px}.type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{flex:none;color:var(--faint)}.card h3{margin:0 0 8px;font-size:16px;line-height:1.45}.summary{margin:0 0 15px;overflow:hidden;display:-webkit-box;color:#aab4bf;font-size:13px;line-height:1.65;-webkit-box-orient:vertical;-webkit-line-clamp:3}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.tag{max-width:100%;padding:3px 7px;overflow:hidden;border:1px solid var(--line);border-radius:5px;color:#aeb8c4;background:#171d25;font-size:11px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.priority{border:0;font-weight:700}.p0{color:var(--red);background:rgba(255,107,112,.13)}.p1{color:var(--orange);background:rgba(255,173,92,.13)}.p2{color:var(--green);background:rgba(101,209,144,.13)}.evidence{color:var(--blue);background:rgba(120,169,255,.12);border:0}.feasibility{color:var(--purple);background:rgba(186,156,255,.12);border:0}
.empty{grid-column:1/-1;min-height:130px;display:grid;place-items:center;padding:25px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:rgba(16,21,28,.55);text-align:center}.empty strong{display:block;color:var(--text)}.empty small{color:var(--faint)}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,4,7,.78);backdrop-filter:blur(5px)}.modal.open{display:flex}.dialog{position:relative;width:min(860px,100%);max-height:88vh;overflow:auto;border:1px solid #354152;border-radius:15px;background:var(--panel);box-shadow:0 20px 55px rgba(0,0,0,.5)}.modal-head{position:sticky;top:0;z-index:2;padding:22px 64px 18px 24px;border-bottom:1px solid var(--line);background:rgba(16,21,28,.97)}.eyebrow{margin-bottom:6px;color:var(--accent);font-size:12px;font-weight:700}.modal h2{margin:0;font-size:clamp(20px,3vw,27px);line-height:1.35}.close{position:absolute;top:18px;right:18px;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:#151b24;font-size:23px;cursor:pointer}.modal-body{padding:24px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--line)}.detail{min-width:0;padding:14px 16px;background:var(--panel)}.detail.wide{grid-column:1/-1}.label{display:block;margin-bottom:5px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.06em}.value{color:#c5cdd6;white-space:pre-wrap;overflow-wrap:anywhere}.source-link{display:inline-flex;margin-top:20px;padding:9px 13px;border:1px solid rgba(100,213,176,.35);border-radius:8px;color:var(--accent);background:rgba(100,213,176,.1);font-weight:700;text-decoration:none}
footer{padding-top:18px;border-top:1px solid #1d2530;color:var(--faint);font-size:12px}
@media(max-width:1180px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.head,.filters,main{width:min(100% - 28px,1500px)}.filters{grid-template-columns:repeat(2,minmax(0,1fr));max-height:164px;overflow:auto}.filters input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.head{align-items:flex-start;padding:12px 0}.meta{flex-direction:column;align-items:flex-end;gap:0;font-size:11px}.meta span+span:before{content:"";margin:0}.grid{grid-template-columns:1fr}.note{display:none}.modal{padding:0;align-items:flex-end}.dialog{width:100%;max-height:94vh;border-radius:15px 15px 0 0}.details{grid-template-columns:1fr}.detail.wide{grid-column:auto}.modal-body{padding:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="head"><h1>🧪 护肤产品企划情报站</h1><div class="meta" aria-live="polite"><span id="updated">最后更新时间：—</span><span id="total">共 0 条</span></div></div>
<div class="filterbar"><div class="filters" aria-label="情报筛选栏">
<select id="region" class="control" aria-label="区域"><option value="all">全部区域</option><option>CN</option><option>JP</option><option>KR</option><option>US</option><option>EU</option><option>global</option></select>
<select id="domain" class="control" aria-label="情报域"><option value="all">全部情报域</option><option value="consumer">消费者趋势</option><option value="competitive">竞品动态</option><option value="tech">技术原料</option><option value="evidence">证据链</option><option value="regulatory">法规宣称</option><option value="supply_patent">供应链专利</option><option value="form_packaging">剂型包材</option><option value="market_feedback">上市反馈</option></select>
<select id="type" class="control" aria-label="类型"><option value="all">全部类型</option><option>新品</option><option>论文</option><option>报告</option><option>法规</option><option>原料</option><option>专利</option><option>竞品</option><option>消费者</option></select>
<select id="priority" class="control" aria-label="优先级"><option value="all">全部优先级</option><option>P0</option><option>P1</option><option>P2</option></select>
<select id="evidence" class="control" aria-label="证据等级"><option value="all">全部证据等级</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
<input id="search" class="control" type="search" placeholder="搜索标题、品牌、成分、技术" aria-label="搜索标题、品牌、成分、技术">
</div></div></header>
<main>
<section class="section"><div class="section-head"><h2>本周 Top 5 <span id="topCount" class="count"></span></h2><span class="note">本周最值得进入产品决策的信号</span></div><div id="topGrid" class="grid"></div></section>
<section class="section"><div class="section-head"><h2>法规预警 <span id="regCount" class="count"></span></h2><span class="note">法规变化、宣称边界与上市风险</span></div><div id="regGrid" class="grid"></div></section>
<section class="section"><div class="section-head"><h2>技术雷达 <span id="techCount" class="count"></span></h2><span class="note">新原料、新机制与可转化技术</span></div><div id="techGrid" class="grid"></div></section>
<section class="section"><div class="section-head"><h2>全部情报 <span id="allCount" class="count"></span></h2><span class="note">受顶部筛选和搜索影响</span></div><div id="allGrid" class="grid"></div></section>
<footer>情报用于产品企划研判；涉及法规、功效和安全性的决策，请回到原始文件与目标市场现行规则复核。</footer>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"><div class="dialog"><div class="modal-head"><div id="modalEyebrow" class="eyebrow"></div><h2 id="modalTitle"></h2><button id="close" class="close" type="button" aria-label="关闭">×</button></div><div class="modal-body"><div id="details" class="details"></div><a id="sourceLink" class="source-link" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></div></div></div>
<script>
(()=>{
"use strict";
const D={consumer:"消费者趋势",competitive:"竞品动态",tech:"技术原料",evidence:"证据链",regulatory:"法规宣称",supply_patent:"供应链专利",form_packaging:"剂型包材",market_feedback:"上市反馈"};
const DA=Object.fromEntries(Object.entries(D).map(([k,v])=>[v,k])),RA={中国:"CN",日本:"JP",韩国:"KR",美国:"US",欧洲:"EU",全球:"global",GLOBAL:"global"};
const $=s=>document.querySelector(s),state={items:[],f:{region:"all",domain:"all",type:"all",priority:"all",evidence:"all",query:""}};
const els={region:$("#region"),domain:$("#domain"),type:$("#type"),priority:$("#priority"),evidence:$("#evidence"),search:$("#search"),modal:$("#modal"),close:$("#close"),details:$("#details"),link:$("#sourceLink")};let lastFocus=null;
const pick=(o,keys,f="")=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];return f},txt=v=>v===undefined||v===null||v===""?"—":String(v),yes=v=>v===true||v===1||String(v).toLowerCase()==="true";
const url=v=>{try{const u=new URL(String(v));return["http:","https:"].includes(u.protocol)?u.href:""}catch{return""}};
const date=v=>{if(!v)return"日期未知";const d=new Date(v);return isNaN(d)?txt(v):new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d)};
function norm(r,i){const domain=DA[String(pick(r,["domain","intel_domain","情报域"]))]||String(pick(r,["domain","intel_domain","情报域"])),p=String(pick(r,["priority","优先级"],"P2")).toUpperCase(),e=String(pick(r,["evidence_level","evidence","证据等级"],"D")).toUpperCase();return{id:pick(r,["id","uuid"],"i"+i),title:txt(pick(r,["title","标题"],"未命名情报")),summary:txt(pick(r,["summary","摘要","what_happened","发生了什么"],"暂无摘要")),source:txt(pick(r,["source","来源"])),date:pick(r,["date","published_at","发布日期","日期"]),region:RA[String(pick(r,["region","区域"]))]||String(pick(r,["region","区域"],"global")),type:txt(pick(r,["type","类型"],"报告")),domain,domainLabel:D[domain]||txt(pick(r,["domain","情报域"],"未分类")),priority:["P0","P1","P2"].includes(p)?p:"P2",evidence:["A","B","C","D"].includes(e)?e:"D",feasibility:txt(pick(r,["regulatory_feasibility","feasibility","法规可行性"],"待评估")),happened:txt(pick(r,["what_happened","发生了什么"],pick(r,["summary","摘要"]))),strength:txt(pick(r,["evidence_strength","证据强度"],e)),use:txt(pick(r,["planning_use","product_planning_use","对产品企划的用途"])),risks:txt(pick(r,["risks_limitations","risks","风险与限制"])),action:txt(pick(r,["recommended_action","action","建议动作"])),worth:txt(pick(r,["worth_reading","值得读全文吗"])),brand:txt(pick(r,["brand","品牌"],"")),ingredients:txt(pick(r,["ingredients","ingredient","成分"],"")),technology:txt(pick(r,["technology","tech","技术"],"")),top5:yes(pick(r,["top5","is_top5"])),alert:yes(pick(r,["regulatory_alert","法规预警"])),url:url(pick(r,["url","source_url","original_url","原文链接"]))}}
function tag(t,c=""){const s=document.createElement("span");s.className=("tag "+c).trim();s.textContent=t;return s}
function card(x){const b=document.createElement("button");b.type="button";b.className="card";b.setAttribute("aria-label","查看详情："+x.title);const k=document.createElement("div");k.className="kicker";const t=document.createElement("span");t.className="type";t.textContent=x.type+" · "+x.source;const d=document.createElement("time");d.className="date";d.textContent=date(x.date);k.append(t,d);const h=document.createElement("h3");h.textContent=x.title;const p=document.createElement("p");p.className="summary";p.textContent=x.summary;const ts=document.createElement("div");ts.className="tags";ts.append(tag(x.priority,"priority "+x.priority.toLowerCase()),tag("证据 "+x.evidence,"evidence"),tag("法规："+x.feasibility,"feasibility"),tag(x.region),tag(x.domainLabel));b.append(k,h,p,ts);b.onclick=()=>open(x,b);return b}
function grid(g,c,items,hint){const box=$("#"+g),n=$("#"+c);box.replaceChildren();n.textContent="("+items.length+")";if(!items.length){const e=document.createElement("div");e.className="empty";const w=document.createElement("div"),s=document.createElement("strong"),m=document.createElement("small");s.textContent="暂无情报数据";m.textContent=hint;w.append(s,m);e.append(w);box.append(e);return}const f=document.createDocumentFragment();items.forEach(x=>f.append(card(x)));box.append(f)}
function filtered(){const q=state.f.query.trim().toLowerCase();return state.items.filter(x=>{const hay=[x.title,x.brand,x.ingredients,x.technology,x.summary].join(" ").toLowerCase();return(state.f.region==="all"||x.region===state.f.region)&&(state.f.domain==="all"||x.domain===state.f.domain)&&(state.f.type==="all"||x.type===state.f.type)&&(state.f.priority==="all"||x.priority===state.f.priority)&&(state.f.evidence==="all"||x.evidence===state.f.evidence)&&(!q||hay.includes(q))})}
function render(){grid("topGrid","topCount",state.items.filter(x=>x.top5).slice(0,5),"data.json 中暂无 top5=true 的条目");grid("regGrid","regCount",state.items.filter(x=>x.domain==="regulatory"||x.alert),"暂无法规预警条目");grid("techGrid","techCount",state.items.filter(x=>x.domain==="tech"),"暂无技术原料条目");grid("allGrid","allCount",filtered(),"请调整顶部筛选条件或搜索词")}
function detail(l,v,wide=false){const x=document.createElement("div");x.className="detail"+(wide?" wide":"");const a=document.createElement("span");a.className="label";a.textContent=l;const b=document.createElement("div");b.className="value";b.textContent=txt(v);x.append(a,b);els.details.append(x)}
function open(x,trigger){lastFocus=trigger;$("#modalTitle").textContent=x.title;$("#modalEyebrow").textContent=x.priority+" · 证据 "+x.evidence+" · "+x.domainLabel;els.details.replaceChildren();[["来源",x.source],["日期",date(x.date)],["区域",x.region],["类型",x.type],["情报域",x.domainLabel],["证据强度",x.strength],["法规可行性",x.feasibility],["值得读全文吗",x.worth]].forEach(v=>detail(...v));[["发生了什么",x.happened],["对产品企划的用途",x.use],["风险与限制",x.risks],["建议动作",x.action]].forEach(v=>detail(v[0],v[1],true));if(x.url){els.link.href=x.url;els.link.hidden=false}else{els.link.removeAttribute("href");els.link.hidden=true}els.modal.classList.add("open");els.modal.setAttribute("aria-hidden","false");document.body.classList.add("lock");els.close.focus()}
function close(){els.modal.classList.remove("open");els.modal.setAttribute("aria-hidden","true");document.body.classList.remove("lock");lastFocus?.focus()}
function meta(data={}){const u=pick(data,["updated_at","last_updated","最后更新时间"],"—");$("#updated").textContent="最后更新时间："+(u==="—"?"—":date(u));$("#total").textContent="共 "+state.items.length+" 条"}
async function load(){try{const r=await fetch("./data.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);const d=await r.json(),raw=Array.isArray(d)?d:Array.isArray(d.items)?d.items:[];state.items=raw.filter(x=>x&&typeof x==="object").map(norm);meta(Array.isArray(d)?{}:d);render()}catch(e){console.warn("data.json 读取失败",e);state.items=[];meta();render()}}
[[els.region,"region"],[els.domain,"domain"],[els.type,"type"],[els.priority,"priority"],[els.evidence,"evidence"]].forEach(([el,k])=>el.onchange=e=>{state.f[k]=e.target.value;render()});let timer;els.search.oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.f.query=e.target.value;render()},120)};els.close.onclick=close;els.modal.onclick=e=>{if(e.target===els.modal)close()};document.onkeydown=e=>{if(e.key==="Escape"&&els.modal.classList.contains("open"))close()};load();
})();
</script>
</body>
</html>
